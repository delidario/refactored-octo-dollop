name: Aggiorna Farmacie di Turno

# Quando si avvia questo processo:
# 1. Ogni giorno alle 06:10 ora di Milano
# 2. Quando pubblichi modifiche sul branch main
# 3. Quando lo avvii manualmente dalla scheda "Actions" su GitHub
on:
  schedule:
    - cron: '10 5 * * *'   # 05:10 UTC = 06:10 CET / 07:10 CEST
  push:
    branches: [main]
  workflow_dispatch:        # avvio manuale

jobs:
  fetch-and-commit:
    name: Scarica i dati e aggiorna la mappa
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica i dati delle farmacie
        run: python scripts/fetch_farmacie.py

      - name: Salva i dati aggiornati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna modifica — niente da committare."
          else
            git commit -m "dati: aggiornamento farmacie di turno $(date -u +'%Y-%m-%d')"
            git push
          fi
