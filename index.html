<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Farmacie di Turno — Milano</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="header-cross">✚</span>
      <h1>Farmacie di Turno — Milano</h1>
    </div>
  </header>

  <div id="controls">

    <div id="day-picker-wrapper">
      <div id="day-picker">
        <!-- Populated by JavaScript -->
      </div>
    </div>

    <div id="search-row">
      <div id="search-wrap">
        <input
          type="text"
          id="search-input"
          placeholder="Cerca per indirizzo o quartiere..."
          autocomplete="off"
        >
        <button id="search-btn" aria-label="Cerca">Cerca</button>
      </div>
      <button id="near-me-btn" title="Trova farmacie vicino a me">
        Vicino a me
      </button>
    </div>

  </div>

  <div id="map-container">
    <div id="map"></div>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>Caricamento dati...</p>
    </div>
  </div>

  <footer>
    <span id="pharmacy-count"></span>
    <span class="disclaimer">Orari e turni sono soggetti a variazioni — verificare la bacheca all'esterno della farmacia.</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqvI=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
